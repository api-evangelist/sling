aid: sling
name: Sling (Morse)
description: >-
  Sling Money — rebranded to Morse in 2026 — is a consumer stablecoin money
  transfer app built by Avian Labs that lets people receive, hold, spend,
  invest, send, and convert US dollars across 150+ countries. It settles
  near-instant, low-fee cross-border payments over the Solana blockchain using
  reserve-backed stablecoins (USDC, EURC, USDP), and pairs the app with a
  prepaid Visa card and US stock/ETF investing. The company is regulated as a
  MiCAR-authorised crypto-asset service provider (AFM, Netherlands), a
  FinCEN-registered US Money Services Business, and is ISO/IEC 27001:2022
  certified. It is a consumer product with no public developer API surface; this
  profile captures its published identity, security, and compliance posture.
